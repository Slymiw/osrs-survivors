<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- phones: no pinch or double-tap zoom, and the page reaches under the notch (the canvas keeps clear of it) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<!-- added to a home screen, it opens full screen like an app -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OSRS Survivors">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/app-icon-192.png">
<link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>OSRS Survivors</title>
<style>
	:root {
		--background: #000;
		--text: #ff981f;
		--shadow: #000;
	}
	html, body {
		margin: 0;
		height: 100%;
		background: var(--background);
		overflow: hidden;
		overscroll-behavior: none;
		-webkit-text-size-adjust: 100%;
	}
	canvas {
		position: fixed;
		left: env(safe-area-inset-left, 0px);
		top: env(safe-area-inset-top, 0px);
		width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
		height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
		height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
		image-rendering: pixelated;
		outline: none;
		/* fingers steer the game: no scrolling, zooming, text selection or long-press menus */
		touch-action: none;
		user-select: none;
		-webkit-user-select: none;
		-webkit-touch-callout: none;
		-webkit-tap-highlight-color: transparent;
	}
	#status {
		position: fixed;
		inset: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 0 16px;
		text-align: center;
		color: var(--text);
		text-shadow: 1px 1px 0 var(--shadow);
		font: 16px sans-serif;
		pointer-events: none;
	}
	#status[hidden] {
		display: none;
	}
	/* the bug report: a stone panel over the game, in the game's colours */
	#report {
		position: fixed;
		inset: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 16px;
		background: rgba(0, 0, 0, 0.6);
		font: 14px sans-serif;
	}
	#report[hidden] {
		display: none;
	}
	#report form {
		box-sizing: border-box;
		width: 100%;
		max-width: 460px;
		max-height: 100%;
		overflow-y: auto;
		padding: 14px 16px;
		background: #3e3529;
		border: 2px solid #181410;
		outline: 1px solid #6e624e;
		color: #f0e8d2;
	}
	#report h2 {
		margin: 0 0 8px;
		color: #ff981f;
		font: 22px "RuneScape Bold", sans-serif;
		text-align: center;
	}
	#report label {
		display: block;
		margin: 10px 0 4px;
		color: #ffff00;
		font: 16px "RuneScape", sans-serif;
	}
	#report textarea, #report input[type=text] {
		box-sizing: border-box;
		width: 100%;
		padding: 6px;
		background: #2d271e;
		border: 1px solid #181410;
		color: #fff;
		/* 16px keeps phones from zooming into the box */
		font: 16px sans-serif;
	}
	#report textarea {
		min-height: 90px;
		resize: vertical;
	}
	#report .tick {
		display: flex;
		gap: 8px;
		align-items: flex-start;
		color: #c8bea0;
	}
	#report .tick input {
		margin-top: 3px;
	}
	#report .buttons {
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
		margin-top: 14px;
	}
	#report button {
		flex: 1 1 100px;
		min-height: 40px;
		background: #4e4437;
		border: 1px solid #181410;
		color: #ff981f;
		font: 18px "RuneScape Bold", sans-serif;
	}
	#report button:disabled {
		color: #78705f;
	}
	#report .note {
		min-height: 18px;
		margin-top: 8px;
		color: #fff;
		text-align: center;
	}
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="status">Loading...</div>
<div id="report" hidden>
	<form>
		<h2>Report a bug</h2>
		<label for="report-what">What happened? What did you expect?</label>
		<textarea id="report-what" maxlength="4000" placeholder="e.g. I tapped the bag tab during a level-up and..."></textarea>
		<label for="report-contact">How can I reply? (optional: Discord, email, RuneScape name)</label>
		<input type="text" id="report-contact" maxlength="200" autocomplete="off">
		<label class="tick"><input type="checkbox" id="report-save" checked>Include my save code, so the run can be loaded
			(coins, upgrades, pets, best times and the saved run; nothing personal)</label>
		<div class="buttons">
			<button type="submit" id="report-send">Send</button>
			<button type="button" id="report-copy">Copy report</button>
			<button type="button" id="report-cancel">Cancel</button>
		</div>
		<div class="note" id="report-note"></div>
	</form>
</div>
<script>
	// The game (game.js, compiled from Java by TeaVM) reads everything through window.OSRS.
	(function () {
		var statusLine = document.getElementById("status");
		function status(text) {
			statusLine.hidden = !text;
			statusLine.textContent = text || "";
		}

		function bytes(base64) {
			var raw = atob(base64);
			var out = new Uint8Array(raw.length);
			for (var i = 0; i < raw.length; i++) {
				out[i] = raw.charCodeAt(i);
			}
			return out;
		}

		function gunzip(data) {
			var stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("gzip"));
			return new Response(stream).arrayBuffer().then(function (buffer) {
				return new Int8Array(buffer);
			});
		}

		// Waits for load, not image.decode(): Android's Chrome rejects decode() ("the source image
		// cannot be decoded") when hundreds run at once; loaded, a picture decodes when first drawn.
		function picture(base64) {
			return new Promise(function (resolve, reject) {
				var image = new Image();
				image.onload = function () {
					if (image.naturalWidth > 0) {
						resolve(image);
					} else {
						reject(new Error("a picture is empty"));
					}
				};
				image.onerror = function () {
					reject(new Error("a picture couldn't be read"));
				};
				image.src = "data:image/png;base64," + base64;
			});
		}

		// map locations are scripts that call OSRS_LOCATION once loaded (this also works from file://)
		// replaced with a build number by `gradlew dist`, so an update never runs with cached scripts
		var BUILD = "@BUILD@";
		var pending = {};
		window.OSRS_LOCATION = function (name, ground, data) {
			var done = pending[name];
			delete pending[name];
			if (!done) {
				return;
			}
			Promise.all([picture(ground), gunzip(bytes(data))]).then(function (loaded) {
				done(loaded[0], loaded[1], null);
			}, function (e) {
				done(null, null, String(e));
			});
		};

		function loadLocation(name, done) {
			pending[name] = done;
			var script = document.createElement("script");
			script.src = "assets/loc/" + name + ".js?v=" + BUILD;
			script.onerror = function () {
				delete pending[name];
				done(null, null, "assets/loc/" + name + ".js is missing");
			};
			document.head.appendChild(script);
		}

		// Sound: the game hands over samples (decoded from the OSRS sound effects in assets/sounds.js)
		// and plays them through two buses, effects and interface, under a master volume and a
		// limiter. Browsers only allow sound after the player presses something, so the context
		// starts on the first key or click. Everything here fails quietly: no sound, no harm.
		var audio = (function () {
			var ctx = null;
			var master = null;
			var buses = {};
			var buffers = {};
			var voices = {};
			var nextVoice = 1;
			var volumes = [0.36, 0.64, 0.64];

			function unlock() {
				try {
					if (!ctx) {
						var Context = window.AudioContext || window.webkitAudioContext;
						if (!Context) {
							return;
						}
						ctx = new Context();
						var limiter = ctx.createDynamicsCompressor();
						limiter.threshold.value = -10;
						limiter.knee.value = 6;
						limiter.ratio.value = 12;
						limiter.attack.value = 0.003;
						limiter.release.value = 0.15;
						limiter.connect(ctx.destination);
						master = ctx.createGain();
						master.connect(limiter);
						buses[0] = ctx.createGain();
						buses[1] = ctx.createGain();
						buses[0].connect(master);
						buses[1].connect(master);
						apply();
					}
					if (ctx.state === "suspended") {
						ctx.resume();
					}
				} catch (e) {
					ctx = null;
				}
			}

			function apply() {
				if (!ctx) {
					return;
				}
				var t = ctx.currentTime;
				master.gain.setTargetAtTime(volumes[0], t, 0.02);
				buses[0].gain.setTargetAtTime(volumes[1], t, 0.02);
				buses[1].gain.setTargetAtTime(volumes[2], t, 0.02);
			}

			["pointerdown", "keydown", "touchstart"].forEach(function (type) {
				window.addEventListener(type, unlock, true);
			});
			document.addEventListener("visibilitychange", function () {
				if (!ctx) {
					return;
				}
				try {
					if (document.visibilityState === "hidden") {
						ctx.suspend();
					} else {
						ctx.resume();
					}
				} catch (e) {
				}
			});

			return {
				ready: function () {
					return !!ctx && ctx.state === "running";
				},
				now: function () {
					return ctx ? ctx.currentTime : 0;
				},
				has: function (id) {
					return !!buffers[id];
				},
				/** The sound's cache file, from assets/sounds.js, or null. */
				raw: function (id) {
					var sounds = window.OSRS_SOUNDS;
					var text = sounds && sounds.data[id];
					return text ? bytes(text) : null;
				},
				/** Keeps samples (copied out of the game's array) as a playable buffer. */
				add: function (id, samples, rate) {
					if (!ctx || samples.length === 0) {
						return;
					}
					try {
						var buffer = ctx.createBuffer(1, samples.length, rate);
						buffer.copyToChannel(samples, 0);
						buffers[id] = buffer;
					} catch (e) {
					}
				},
				volumes: function (m, effects, ui) {
					volumes = [m, effects, ui];
					apply();
				},
				/** Starts a sound; returns a number to stop it with, or 0 if it couldn't play. */
				play: function (id, bus, gain, rate, pan, delay) {
					var buffer = buffers[id];
					if (!ctx || !buffer || ctx.state !== "running") {
						return 0;
					}
					try {
						var source = ctx.createBufferSource();
						source.buffer = buffer;
						source.playbackRate.value = rate;
						var level = ctx.createGain();
						level.gain.value = gain;
						source.connect(level);
						var out = level;
						if (pan !== 0 && ctx.createStereoPanner) {
							var panner = ctx.createStereoPanner();
							panner.pan.value = pan;
							level.connect(panner);
							out = panner;
						}
						out.connect(buses[bus] || buses[0]);
						var voice = nextVoice++;
						voices[voice] = {source: source, level: level};
						source.onended = function () {
							delete voices[voice];
							try {
								source.disconnect();
								level.disconnect();
							} catch (e) {
							}
						};
						source.start(ctx.currentTime + Math.max(0, delay));
						return voice;
					} catch (e) {
						return 0;
					}
				},
				/** Fades a sound out quickly (to make room for a more important one). */
				stop: function (voice) {
					var v = voices[voice];
					if (!v || !ctx) {
						return;
					}
					try {
						v.level.gain.setTargetAtTime(0, ctx.currentTime, 0.015);
						v.source.stop(ctx.currentTime + 0.08);
					} catch (e) {
					}
				}
			};
		})();

		// Full screen where the browser has it (not phones' Safari; added to the home screen, the
		// page opens full screen anyway, which counts as on)
		var fullscreen = {
			available: function () {
				return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
			},
			active: function () {
				if (document.fullscreenElement || document.webkitFullscreenElement || navigator.standalone) {
					return true;
				}
				try {
					return window.matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches;
				} catch (e) {
					return false;
				}
			},
			toggle: function () {
				try {
					var d = document;
					if (d.fullscreenElement || d.webkitFullscreenElement) {
						(d.exitFullscreen || d.webkitExitFullscreen).call(d);
						return;
					}
					var root = d.documentElement;
					var request = root.requestFullscreen || root.webkitRequestFullscreen;
					var result = request && request.call(root, {navigationUI: "hide"});
					if (result && result.catch) {
						result.catch(function () {
						});
					}
				} catch (e) {
				}
			}
		};

		// The back button (a phone's, or the browser's) pauses the run or closes the page on show
		// instead of leaving; on the main menu it's let through, and the next press leaves.
		var back = {armed: false, callback: null};
		function armBack() {
			if (back.armed || !back.callback) {
				return;
			}
			try {
				history.pushState({osrs: true}, "");
				back.armed = true;
			} catch (e) {
			}
		}
		window.addEventListener("popstate", function () {
			back.armed = false;
			var used = false;
			try {
				used = back.callback && back.callback();
			} catch (e) {
			}
			if (used) {
				armBack();
			}
		});

		// Bug reports go to a Google Form: no server, and players need no account. Set FORM to the
		// form's address ending in /formResponse, and each field to its "entry.<number>" (from the
		// form's "Get pre-filled link"). Left empty, the report can only be copied.
		var BUG_REPORT = {
			form: "https://docs.google.com/forms/d/e/1FAIpQLSfHruPE8hZnK2Zzv7zOHAGffOXDzRg4B8ENde2r3bXdpv5CRQ/formResponse",
			what: "entry.1383834749",
			contact: "entry.1048111489",
			details: "entry.254907162"
		};
		// the last few errors, for bug reports
		var errors = [];
		function noteError(text) {
			errors.push(new Date().toISOString().slice(11, 19) + " " + String(text).slice(0, 400));
			if (errors.length > 8) {
				errors.shift();
			}
		}
		window.addEventListener("error", function (e) {
			noteError(e.message + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
		});
		window.addEventListener("unhandledrejection", function (e) {
			noteError("Unhandled: " + (e.reason && e.reason.message || e.reason));
		});
		var consoleError = console.error;
		console.error = function () {
			noteError(Array.prototype.join.call(arguments, " "));
			consoleError.apply(console, arguments);
		};

		var bugReport = (function () {
			var box = document.getElementById("report");
			var what = document.getElementById("report-what");
			var contact = document.getElementById("report-contact");
			var withSave = document.getElementById("report-save");
			var send = document.getElementById("report-send");
			var note = document.getElementById("report-note");
			var details = "";
			var saveCode = "";
			var lastSent = 0;
			var ready = !!(BUG_REPORT.form && BUG_REPORT.what && BUG_REPORT.details);

			function device() {
				var s = window.screen || {};
				return "Browser: " + navigator.userAgent + "\n"
					+ "Window: " + innerWidth + "x" + innerHeight + " at " + (window.devicePixelRatio || 1) + "x, screen "
					+ s.width + "x" + s.height + (fullscreen.active() ? ", full screen" : "") + "\n"
					+ "Page: " + location.href.split("#")[0] + "\n";
			}

			function report() {
				return details + device()
					+ "Errors: " + (errors.length ? "\n" + errors.join("\n") : "none") + "\n"
					+ (withSave.checked && saveCode ? "Save code: " + saveCode + "\n" : "");
			}

			function close() {
				box.hidden = true;
				document.getElementById("game").focus();
			}

			function copy() {
				var text = "What happened:\n" + what.value + "\n\nReply to: " + (contact.value || "-") + "\n\n" + report();
				var shown = function () {
					note.textContent = "Copied. Paste it wherever you can reach the developer.";
				};
				if (navigator.clipboard && navigator.clipboard.writeText) {
					navigator.clipboard.writeText(text).then(shown, function () {
						window.prompt("Copy this report:", text);
					});
				} else {
					window.prompt("Copy this report:", text);
				}
			}

			box.querySelector("form").addEventListener("submit", function (e) {
				e.preventDefault();
				if (!what.value.trim()) {
					note.textContent = "Say what happened first.";
					what.focus();
					return;
				}
				if (Date.now() - lastSent < 60000) {
					note.textContent = "Thanks! One report a minute, please.";
					return;
				}
				var body = new URLSearchParams();
				body.append(BUG_REPORT.what, what.value);
				body.append(BUG_REPORT.details, report());
				if (BUG_REPORT.contact) {
					body.append(BUG_REPORT.contact, contact.value);
				}
				send.disabled = true;
				note.textContent = "Sending...";
				// Google doesn't let pages read its answer (no-cors), so getting there counts as sent
				fetch(BUG_REPORT.form, {method: "POST", mode: "no-cors", body: body}).then(function () {
					lastSent = Date.now();
					what.value = "";
					note.textContent = "Sent. Thank you!";
					setTimeout(close, 1200);
				}, function () {
					note.textContent = "Couldn't send (are you online?). Copy the report instead.";
				}).then(function () {
					send.disabled = !ready;
				});
			});
			document.getElementById("report-copy").addEventListener("click", copy);
			document.getElementById("report-cancel").addEventListener("click", close);
			box.addEventListener("keydown", function (e) {
				// the game doesn't see keys typed here
				e.stopPropagation();
				if (e.key === "Escape") {
					close();
				}
			});

			return {
				open: function (gameDetails, code) {
					details = gameDetails;
					saveCode = code;
					send.disabled = !ready;
					note.textContent = ready ? "" : "Sending isn't set up yet: copy the report instead.";
					box.hidden = false;
					what.focus();
				}
			};
		})();

		window.OSRS = {
			status: status,
			bugReport: bugReport,
			images: {},
			manifest: null,
			models: null,
			loadLocation: loadLocation,
			audio: audio,
			fullscreen: fullscreen,
			trapBack: function (callback) {
				back.callback = callback;
				armBack();
			},
			armBack: armBack
		};

		function start() {
			var data = window.OSRS_DATA;
			if (!data) {
				status("The game's artwork (assets/data.js) is missing. Export it with: ./gradlew exportAssets");
				return;
			}
			window.OSRS.manifest = data.manifest;
			var fonts = [["RuneScape", data.fonts.regular], ["RuneScape Bold", data.fonts.bold], ["RuneScape Small", data.fonts.small]]
				.map(function (f) {
					var face = new FontFace(f[0], bytes(f[1]).buffer);
					document.fonts.add(face);
					return face.load();
				});
			var images = Object.keys(data.images).map(function (name) {
				return picture(data.images[name]).then(function (image) {
					window.OSRS.images[name] = image;
				});
			});
			var models = gunzip(bytes(data.models)).then(function (m) {
				window.OSRS.models = m;
			});
			Promise.all(fonts.concat(images, [models])).then(function () {
				// the data is decoded; let go of the encoded copy
				window.OSRS_DATA = null;
				main([]);
				document.getElementById("game").focus();
			}, function (e) {
				status("Couldn't load the game: " + e);
			});
		}

		window.addEventListener("load", start);
	})();
</script>
<script src="assets/data.js?v=@BUILD@"></script>
<!-- the sound effects; the game plays silently without them -->
<script src="assets/sounds.js?v=@BUILD@" onerror="window.OSRS_SOUNDS = null"></script>
<script src="game.js?v=@BUILD@"></script>
</body>
</html>
